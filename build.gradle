plugins {
    id 'java'
    id 'eclipse'
}

jar {
    archiveBaseName = 'carTracker'
    archiveVersion  = ''
}
 
repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
 
dependencies {
    implementation files('../CMF_2/common-base/build/libs/common_base-all.jar')
    implementation fileTree(dir: '../CMF_2/common-base/lib', include: '*.jar')
    implementation fileTree(dir: 'lib', include: '*.jar')
    implementation group: 'org.jppf', name: 'jppf-common', version: '5.2.8'
    implementation group: 'org.jppf', name: 'jppf-client', version: '5.2.8'
    implementation group: 'org.jppf', name: 'jppf-node', version: '5.2.8'
    implementation group: 'net.sourceforge.jexcelapi', name: 'jxl', version: '2.6.12'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.5'
    implementation group: 'com.google.collections', name: 'google-collections', version: '1.0-rc2'
}
